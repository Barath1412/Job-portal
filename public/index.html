<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - Find Your Next Opportunity</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="nav-header"></div>

    <div class="flex-grow bg-cover bg-center flex items-center justify-center relative shadow-inner" style="background-image: linear-gradient(to right, rgba(15, 23, 42, 0.85), rgba(30, 58, 138, 0.75)), url('images/hero_banner.png');">
        <div class="text-center text-white p-8 max-w-3xl mx-auto">
            <span class="inline-block bg-blue-500 bg-opacity-30 backdrop-filter backdrop-blur-sm text-blue-200 text-xs font-semibold px-3 py-1 rounded-full border border-blue-400 border-opacity-40 uppercase tracking-widest mb-4">
                Your Next Career Move Starts Here
            </span>
            <h1 class="text-5xl sm:text-6xl font-extrabold mb-4 tracking-tight leading-tight">
                Discover Top Career Opportunities
            </h1>
            <p class="text-lg sm:text-xl text-gray-200 mb-8 font-light max-w-xl mx-auto leading-relaxed">
                Connect with leading tech companies and manage your job applications seamlessly.
            </p>
            <div class="flex flex-col sm:flex-row justify-center items-center space-y-3 sm:space-y-0 sm:space-x-4">
                <a href="jobs.html" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3.5 rounded-lg shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 text-center">
                    Browse Jobs 🔍
                </a>
                <a href="register.html" class="w-full sm:w-auto bg-white hover:bg-gray-100 text-gray-900 font-semibold px-8 py-3.5 rounded-lg shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 text-center">
                    Post a Job / Sign Up 🚀
                </a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
