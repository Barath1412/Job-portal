<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="nav-header"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Explore Career Opportunities</h1>
            <p class="text-gray-600">Discover job openings tailored to your preferences.</p>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                <div>
                    <label for="titleFilter" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Job Title</label>
                    <input type="text" id="titleFilter" placeholder="e.g. Engineer, Developer"
                           class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                </div>

                <div>
                    <label for="locationFilter" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Location</label>
                    <input type="text" id="locationFilter" placeholder="e.g. Remote, New York"
                           class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                </div>

                <div>
                    <label for="companyFilter" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Company</label>
                    <input type="text" id="companyFilter" placeholder="e.g. Tech Corp"
                           class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                </div>

                <div>
                    <label for="sortSelect" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Sort By</label>
                    <select id="sortSelect" class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm bg-white">
                        <option value="deadline:asc">Deadline (Soonest First)</option>
                        <option value="deadline:desc">Deadline (Latest First)</option>
                        <option value="createdAt:desc">Newest Added First</option>
                        <option value="title:asc">Title (A - Z)</option>
                        <option value="title:desc">Title (Z - A)</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                <span id="resultsCount" class="text-xs font-medium text-gray-500">Loading results...</span>
                <button id="clearFiltersBtn" class="text-xs text-blue-600 hover:text-blue-800 font-semibold underline">Clear All Filters</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="py-16 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-3"></div>
            <p class="text-gray-500 text-sm font-medium">Searching for available jobs...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden py-12 text-center bg-white rounded-lg shadow-sm border border-red-200 p-6">
            <p class="text-red-600 font-semibold mb-2" id="errorMessage">Failed to load jobs.</p>
            <button id="retryBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium transition">Retry Search</button>
        </div>

        <!-- Jobs Grid Container -->
        <div id="jobsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Job cards populated via JS -->
        </div>

        <!-- Empty State -->
        <div id="noJobsMsg" class="hidden text-center py-16 bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <div class="text-4xl mb-3">🔍</div>
            <h3 class="text-lg font-bold text-gray-900 mb-1">No jobs match your search</h3>
            <p class="text-gray-500 text-sm mb-4">Try adjusting your filters or search terms.</p>
            <button id="clearFiltersBtnEmpty" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium text-sm transition">Clear Filters</button>
        </div>

        <!-- Pagination Controls -->
        <div id="paginationControls" class="hidden flex items-center justify-between bg-white px-6 py-4 rounded-lg shadow-sm border border-gray-200">
            <button id="prevPageBtn" class="bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-2 rounded-md text-sm font-medium transition">
                &larr; Previous Page
            </button>

            <span id="pageIndicator" class="text-sm font-semibold text-gray-700">Page 1 of 1</span>

            <button id="nextPageBtn" class="bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-2 rounded-md text-sm font-medium transition">
                Next Page &rarr;
            </button>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/jobs.js"></script>
</body>
</html>
