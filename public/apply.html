<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="nav-header"></div>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-lg w-full bg-white rounded-lg shadow-md p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Job Application</h1>
            <p id="jobTitleHeader" class="text-sm text-gray-600 mb-6">Submitting application for position</p>

            <div id="error-alert" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded"></div>
            <div id="success-alert" class="hidden mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
                <p class="font-bold mb-1">Application Submitted Successfully! 🎉</p>
                <p class="text-sm mb-3">Your application has been received by the recruiter.</p>
                <div class="flex space-x-3">
                    <a href="my-applications.html" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700 font-medium">View My Applications</a>
                    <a href="jobs.html" class="bg-gray-200 text-gray-800 px-3 py-1.5 rounded text-sm hover:bg-gray-300 font-medium">Back to Jobs</a>
                </div>
            </div>

            <form id="applicationForm" class="space-y-4">
                <div>
                    <label for="applicantName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="applicantName" name="applicantName" required placeholder="John Doe"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="resumeFile" class="block text-sm font-medium text-gray-700 mb-1">Resume File (PDF only, max 5MB)</label>
                    <input type="file" id="resumeFile" name="resumeFile" accept="application/pdf" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <p class="text-xs text-gray-500 mt-1">Please select a PDF document under 5MB.</p>
                </div>

                <div>
                    <label for="coverLetter" class="block text-sm font-medium text-gray-700 mb-1">Cover Letter</label>
                    <textarea id="coverLetter" name="coverLetter" rows="4" required placeholder="Explain why you are a great fit for this position..."
                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition">
                    Submit Application
                </button>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/apply.js"></script>
</body>
</html>
