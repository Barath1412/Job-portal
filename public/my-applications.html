<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="nav-header"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">My Applications</h1>
            <p class="text-gray-600">Track the status of all your submitted job applications.</p>
        </div>

        <div id="errorAlert" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded"></div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Job Title</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Company</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Resume Link</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTable" class="bg-white divide-y divide-gray-200">
                        <!-- Applications populated via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="noAppsMsg" class="hidden text-center py-12">
                <p class="text-gray-500 text-lg mb-4">You haven't submitted any job applications yet.</p>
                <a href="jobs.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-md font-medium text-sm hover:bg-blue-700">Browse Jobs</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/my-applications.js"></script>
</body>
</html>
