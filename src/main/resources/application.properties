# Use H2 in-memory database instead of MongoDB
spring.datasource.url=jdbc:h2:mem:job_portal
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Port
server.port=8080

# Spring Security - hardcoded admin credentials REMOVED (now using JWT)

# JWT Configuration
# WARNING: Replace this placeholder secret with a real Base64-encoded 256-bit key
# via environment variable before any real deployment. Do NOT commit a production secret.
app.jwt.secret=dGhpcy1pcy1hLXBsYWNlaG9sZGVyLXNlY3JldC1rZXktZm9yLWRldi1vbmx5LXJlcGxhY2UtYmVmb3JlLWRlcGxveQ==
app.jwt.expiration-ms=86400000

# Enable JPA repositories
spring.data.jpa.repositories.enabled=true

# Multipart Upload Limits (5MB max)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

